<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thư Viện Số</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div id="screen-main" class="screen active">
  <nav class="navbar">
    <div class="nav-brand">
      <svg viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="8" fill="#2D5A3D"/>
        <path d="M8 9.5h5c1.5 0 2.7 1.2 2.7 2.7v10.8c0-1.5-1.2-2.7-2.7-2.7H8V9.5z" fill="#C8A96E"/>
        <path d="M24 9.5h-5c-1.5 0-2.7 1.2-2.7 2.7v10.8c0-1.5 1.2-2.7 2.7-2.7h5V9.5z" fill="rgba(255,255,255,.75)"/>
      </svg>
      <span>Thư Viện Số</span>
    </div>
    <div class="nav-links">
      <button class="nav-btn active" id="nav-seat" onclick="switchPage('seat')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="8" width="12" height="6" rx="1.5"/><path d="M5 8V5.5A2.5 2.5 0 0 1 7.5 3h1A2.5 2.5 0 0 1 11 5.5V8"/><path d="M2 11h12"/></svg>
        Đặt chỗ ngồi
      </button>
      <button class="nav-btn" id="nav-book" onclick="switchPage('book')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2.5h7c.8 0 1.5.7 1.5 1.5v9c0 .8-.7 1.5-1.5 1.5H3"/><path d="M3 2.5A1.5 1.5 0 0 0 1.5 4v8c0 .8.7 1.5 1.5 1.5"/><path d="M6 6h4M6 8.5h3"/></svg>
        Mượn sách
      </button>
    </div>
    <div class="nav-right">
      <button class="avatar-btn" id="avatar-btn" onclick="toggleDropdown()">{{ user.name[0]|upper if user and user.name else 'U' }}</button>
      <div class="dropdown" id="dropdown">
        <div class="dropdown-header"><strong>{{ user.name }}</strong><span>{{ user.email }}</span></div>
        <button class="dd-item" onclick="openManage('seats')">
          <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="7" width="12" height="6" rx="1.5"/><path d="M4.5 7V5A3 3 0 0 1 7.5 2h0A3 3 0 0 1 10.5 5v2"/></svg>
          Quản lý chỗ ngồi
        </button>
        <button class="dd-item" onclick="openManage('books')">
          <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 2h7c.8 0 1.5.7 1.5 1.5v9c0 .8-.7 1.5-1.5 1.5h-7"/><path d="M2.5 2A1.5 1.5 0 0 0 1 3.5v8c0 .8.7 1.5 1.5 1.5"/></svg>
          Quản lý sách mượn
        </button>
        <div class="dd-divider"></div>
        <button class="dd-item" onclick="openManage('profile')">
          <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7.5" cy="5" r="2.5"/><path d="M2 13c0-3 2.5-4.5 5.5-4.5S13 10 13 13"/></svg>
          Sửa thông tin
        </button>
        <div class="dd-divider"></div>
        <button class="dd-item logout" onclick="doLogout()">
          <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 2H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3M10 10l3-3-3-3M13 7H6"/></svg>
          Đăng xuất
        </button>
      </div>
    </div>
  </nav>

  <div class="main">
    <!-- Seat booking page -->
    <div class="page-content active" id="page-seat">
      <div class="page-hero">
        <h2>Đặt chỗ ngồi</h2>
        <p>Chọn vị trí yêu thích và đặt chỗ trước khi đến thư viện</p>
      </div>
      <div class="floor-map">
        <div class="floor-label">Khu đọc sách yên tĩnh</div>
        <div class="seats-grid" id="seats-grid"></div>
        <div class="seat-legend">
          <canvas id="layout-canvas" width="1034" height="500"></canvas>
          <div class="legend-row"> 
            <div style="display:flex;align-items:center;gap:6px"><div class="legend-dot avail"></div><span>Còn trống</span></div>
            <div style="display:flex;align-items:center;gap:6px"><div class="legend-dot taken"></div><span>Đã đặt</span></div>
            <div style="display:flex;align-items:center;gap:6px"><div class="legend-dot sel"></div><span>Đang chọn</span></div>
          </div>
        </div>
      </div>
      <div class="booking-panel">
        <div class="selected-info" id="selected-info">Vui lòng chọn một chỗ ngồi từ sơ đồ</div>
        <div class="row2">
          <div><span class="section-label">Ngày đặt</span><input type="date" class="input-field" id="book-date"/></div>
          <div><span class="section-label">Thời gian</span>
            <select class="input-field" id="book-time">
              <option>08:00 – 10:00</option><option>10:00 – 12:00</option>
              <option>13:00 – 15:00</option><option>15:00 – 17:00</option><option>17:00 – 20:00</option>
            </select>
          </div>
        </div>
        <div style="margin-top:1.25rem">
          <button class="btn-book" onclick="confirmBooking()">Xác nhận đặt chỗ</button>
        </div>
      </div>
    </div>

    <!-- Borrow books page -->
    <div class="page-content" id="page-book">
      <div class="page-hero">
        <h2>Mượn sách</h2>
        <p>Tìm kiếm và mượn sách từ bộ sưu tập của thư viện</p>
      </div>
      <div class="search-bar">
        <input type="text" placeholder="Tìm theo tên sách, tác giả..." id="search-input" oninput="filterBooks()"/>
        <button onclick="filterBooks()">Tìm kiếm</button>
      </div>
      <div class="books-grid" id="books-grid"></div>
    </div>
  </div>
</div>

<!-- Manage modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal">
    <div class="modal-title" id="modal-title">
      <span id="modal-title-text"></span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
<script>
  const CURRENT_USER = {{ user | tojson }};
</script>
</body>
</html>
