<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Thư Viện Số</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .layout-wrapper { overflow: auto; padding: 1rem 0; }
    #layout-container { margin: 0 auto; }
  </style>
</head>
<body>

<div id="screen-main" class="screen active">
  <nav class="navbar">
    <div class="nav-brand">
      <svg viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="8" fill="#2D5A3D"/>
        <path d="M8 9.5h5c1.5 0 2.7 1.2 2.7 2.7v10.8c0-1.5-1.2-2.7-2.7-2.7H8V9.5z" fill="#C8A96E"/>
        <path d="M24 9.5h-5c-1.5 0-2.7 1.2-2.7 2.7v10.8c0-1.5 1.2-2.7 2.7-2.7h5V9.5z" fill="rgba(255,255,255,.75)"/>
      </svg>
      <span>Thư Viện Số</span>
    </div>
    <div class="nav-links">
      <button class="nav-btn active" id="nav-seat" onclick="switchPage('seat')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="8" width="12" height="6" rx="1.5"/>
          <path d="M5 8V5.5A2.5 2.5 0 0 1 7.5 3h1A2.5 2.5 0 0 1 11 5.5V8"/>
          <path d="M2 11h12"/>
        </svg>
        Đặt chỗ ngồi
      </button>
      <button class="nav-btn" id="nav-book" onclick="switchPage('book')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 2.5h7c.8 0 1.5.7 1.5 1.5v9c0 .8-.7 1.5-1.5 1.5H3"/>
          <path d="M3 2.5A1.5 1.5 0 0 0 1.5 4v8c0 .8.7 1.5 1.5 1.5"/>
          <path d="M6 6h4M6 8.5h3"/>
        </svg>
        Mượn sách
      </button>
    </div>
    <div class="nav-right">
      <button class="avatar-btn" id="avatar-btn" onclick="toggleDropdown()">
        {{ user.name[0]|upper if user and user.name else 'U' }}
      </button>
      <div class="dropdown" id="dropdown">
        <div class="dropdown-header">
          <strong>{{ user.name }}</strong>
          <span>{{ user.email }}</span>
        </div>
        <button class="dd-item" onclick="openManage('seats')">
          <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="1.5" y="7" width="12" height="6" rx="1.5"/>
            <path d="M4.5 7V5A3 3 0 0 1 7.5 2h0A3 3 0 0 1 10.5 5v2"/>
          </svg>
          Quản lý chỗ ngồi
        </button>
        <button class="dd-item" onclick="openManage('books')">
          <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M2.5 2h7c.8 0 1.5.7 1.5 1.5v9c0 .8-.7 1.5-1.5 1.5h-7"/>
            <path d="M2.5 2A1.5 1.5 0 0 0 1 3.5v8c0 .8.7 1.5 1.5 1.5"/>
          </svg>
          Quản lý sách mượn
        </button>
        <div class="dd-divider"></div>
        <button class="dd-item" onclick="openManage('profile')">
          <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4">
            <circle cx="7.5" cy="5" r="2.5"/>
            <path d="M2 13c0-3 2.5-4.5 5.5-4.5S13 10 13 13"/>
          </svg>
          Sửa thông tin
        </button>
        <div class="dd-divider"></div>
        <button class="dd-item logout" onclick="doLogout()">
          <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M6 2H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3M10 10l3-3-3-3M13 7H6"/>
          </svg>
          Đăng xuất
        </button>
      </div>
    </div>
  </nav>

  <div class="main">

    <!-- Seat booking page -->
    <div class="page-content active" id="page-seat">
      <div class="page-hero">
        <h2>Đặt chỗ ngồi</h2>
        <p>Chọn ghế trên sơ đồ và xác nhận đặt chỗ ngay trong popup</p>
      </div>

      <div class="floor-map">
        <div class="floor-label">Khu đọc sách yên tĩnh</div>
        <div class="layout-wrapper">
          <div id="layout-container"></div>
        </div>
        <div class="seat-legend" style="margin-top:1rem">
          <div class="legend-row">
            <div style="display:flex;align-items:center;gap:6px">
              <div class="legend-dot avail"></div><span>Còn trống</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px">
              <div class="legend-dot taken"></div><span>Đã đặt</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px">
              <div class="legend-dot sel"></div><span>Đang chọn</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Borrow books page -->
    <div class="page-content" id="page-book">
      <div class="page-hero">
        <h2>Mượn sách</h2>
        <p>Tìm kiếm và mượn sách từ bộ sưu tập của thư viện</p>
      </div>
      <div class="search-bar">
        <input type="text" placeholder="Tìm theo tên sách, tác giả..." id="search-input" oninput="filterBooks()"/>
        <button onclick="filterBooks()">Tìm kiếm</button>
      </div>
      <div class="books-grid" id="books-grid"></div>
    </div>

  </div>

  <!-- iOS Bottom Tab Bar -->
  <nav class="tab-bar" id="tab-bar">
    <button class="tab-bar-item active" id="tab-seat" onclick="switchPage('seat')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="12" width="18" height="9" rx="2"/>
        <path d="M7 12V8.5A3.5 3.5 0 0 1 10.5 5h3A3.5 3.5 0 0 1 17 8.5V12"/>
        <path d="M3 16h18"/>
      </svg>
      Đặt chỗ
    </button>
    <button class="tab-bar-item" id="tab-book" onclick="switchPage('book')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 4h14c1 0 2 .9 2 2v13c0 1-.9 2-2 2H4"/>
        <path d="M4 4A2 2 0 0 0 2 6v13c0 1 .9 2 2 2"/>
        <path d="M9 9h7M9 13h5"/>
      </svg>
      Sách
    </button>
    <button class="tab-bar-item" id="tab-profile" onclick="openManage('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      Hồ sơ
    </button>
  </nav>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal">
    <div class="modal-title" id="modal-title">
      <span id="modal-title-text"></span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
<script>
  const CURRENT_USER = {{ user | tojson }};
</script>
</body>
</html>
