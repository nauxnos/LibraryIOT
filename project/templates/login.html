<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập - Thư Viện Số</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
<div id="screen-login" class="screen">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#2D5A3D"/>
        <path d="M12 14h8c2.2 0 4 1.8 4 4v16c0-2.2-1.8-4-4-4h-8V14z" fill="#C8A96E"/>
        <path d="M36 14h-8c-2.2 0-4 1.8-4 4v16c0-2.2 1.8-4 4-4h8V14z" fill="rgba(255,255,255,0.7)"/>
      </svg>
      <h1>Thư Viện Số</h1>
      <p>Hệ thống quản lý thư viện thông minh</p>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Đăng nhập</button>
      <button class="tab-btn" onclick="switchTab('signup')">Đăng ký</button>
    </div>
    <div id="form-login" class="form-panel active">
      <form onsubmit="doLogin()">
        <div class="form-group"><label>Email</label><input type="email" placeholder="ten@email.com" id="l-email"/></div>
        <div class="form-group"><label>Mật khẩu</label><input type="password" placeholder="••••••••" id="l-pass"/></div>
        <button class="btn-primary" onclick="doLogin()">Đăng nhập</button>
      </form>
    </div>
    <div id="form-signup" class="form-panel">
      <div class="form-group"><label>Họ và tên</label><input type="text" placeholder="Nguyễn Văn A" id="s-name"/></div>
      <div class="form-group"><label>Email</label><input type="email" placeholder="ten@email.com" id="s-email"/></div>
      <div class="form-group"><label>Mật khẩu</label><input type="password" placeholder="••••••••" id="s-pass"/></div>
      <button class="btn-primary" onclick="doSignup()">Tạo tài khoản</button>
    </div>
    <p class="login-footer" id="login-hint">Chưa có tài khoản? <a href="#" onclick="switchTab('signup');return false" style="color:#2D5A3D">Đăng ký ngay</a></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</body>
</html>
